<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../src/capture.css"><style>html,body{height:600px;width:800px}#root{height:600px;width:800px}#result{display:none}</style><div id="root"></div><pre id="result">pending</pre>
<script type="module">
import {mountScreenshot} from '../src/screenshot-selection.js';
import {captureCanvas} from '../src/capture-pixels.js';
const results=[],check=(name,pass)=>{results.push({name,pass:!!pass});if(!pass)throw new Error(name);};
try{
 const root=document.getElementById('root');let confirmed=[],cancelled=0,locks=[];
 const canvas=document.createElement('canvas');canvas.width=1600;canvas.height=1200;
 const make=()=>mountScreenshot(root,{image:canvas,width:1600,height:1200,confirm:async region=>{confirmed.push(region);},cancel:async()=>{cancelled++;},lock:value=>locks.push(value)});
 let ui=make();await ui.ready;check('待选界面无需等待整屏像素即可就绪',root.querySelector('.capture-hint').offsetWidth>0);
 check('初始无截图铺屏、选区及工具栏',ui.idle&&ui.region()===null&&canvas.hidden&&root.querySelector('.capture-selection').hidden&&root.querySelector('.capture-toolbar').hidden);
 check('截图模式显示准星和操作提示',getComputedStyle(root).cursor==='crosshair'&&!root.querySelector('.capture-hint').hidden&&root.querySelector('.capture-hint').textContent.includes('双击截取整屏'));
 const event=(type,x,y)=>new PointerEvent(type,{bubbles:true,pointerId:1,button:0,clientX:x,clientY:y});
 root.setPointerCapture=()=>{};root.hasPointerCapture=()=>false;
 const click=(x,y)=>{root.dispatchEvent(event('pointerdown',x,y));root.dispatchEvent(event('pointerup',x,y));};
 document.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));await Promise.resolve();check('无选区时Enter不复制',confirmed.length===0);
 root.dispatchEvent(event('pointermove',790,590));const hint=root.querySelector('.capture-hint').getBoundingClientRect();check('鼠标旁提示保持屏幕内',hint.right<=800&&hint.bottom<=600);
 root.dispatchEvent(event('pointerdown',100,100));root.dispatchEvent(event('pointermove',102,101));root.dispatchEvent(event('pointerup',102,101));
 check('单击及微小抖动保持待选且释放锁屏',ui.idle&&ui.region()===null&&confirmed.length===0&&locks.at(-1)===false&&canvas.hidden&&root.querySelector('.capture-toolbar').hidden);
 root.dispatchEvent(event('pointerdown',300,250));root.dispatchEvent(event('pointermove',100,50));
 check('拖动期间隐藏工具栏且固定显示器',root.querySelector('.capture-toolbar').hidden&&locks.at(-1)===true&&!ui.idle);
 root.dispatchEvent(event('pointerup',100,50));check('反向拖选按物理像素换算',JSON.stringify(ui.region())===JSON.stringify([200,100,400,400]));
 check('选中后锁屏且显示完整工具栏',!ui.idle&&locks.at(-1)===true&&!root.querySelector('.capture-toolbar').hidden&&root.querySelector('.capture-toolbar').getBoundingClientRect().bottom<=600);
 document.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));await Promise.resolve();check('Enter复制已选区域',confirmed.length===1&&JSON.stringify(confirmed[0])===JSON.stringify([200,100,400,400]));ui.dispose();
 ui=make();await ui.ready;
 click(780,580);check('首次点击仍无选区及工具栏',ui.idle&&ui.region()===null&&root.querySelector('.capture-toolbar').hidden);
 click(780,580);root.dispatchEvent(new MouseEvent('dblclick',{bubbles:true,button:0,clientX:780,clientY:580}));await Promise.resolve();
 check('背景双击直接复制当前整屏一次',confirmed.length===2&&JSON.stringify(confirmed[1])===JSON.stringify([0,0,1600,1200]));ui.dispose();
 ui=make();await ui.ready;document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));check('待选时Esc取消且不复制',cancelled===1&&confirmed.length===2);
 root.dispatchEvent(event('pointerdown',300,300));root.dispatchEvent(event('pointercancel',300,300));check('指针取消恢复待选并解锁',ui.idle&&locks.at(-1)===false);
 const other=document.createElement('button');other.textContent='outside';document.body.append(other);ui.dispose();check('销毁移除截图DOM与指针处理',root.children.length===0&&root.onpointerdown===null);other.remove();
 ui=make();await ui.ready;
 const drag=(x,y,endX,endY)=>{root.dispatchEvent(event('pointerdown',x,y));root.dispatchEvent(event('pointermove',endX,endY));root.dispatchEvent(event('pointerup',endX,endY));};
 const doubleClick=(x,y,target=root)=>{click(x,y);click(x,y);target.dispatchEvent(new MouseEvent('dblclick',{bubbles:true,button:0,clientX:x,clientY:y}));};
 drag(300,250,100,50);
 root.dispatchEvent(event('pointerdown',150,100));root.dispatchEvent(event('pointermove',152,101));root.dispatchEvent(event('pointerup',152,101));
 check('选区内单击及微抖保留原范围',JSON.stringify(ui.region())===JSON.stringify([200,100,400,400])&&confirmed.length===2);
 root.querySelector('.capture-toolbar').dispatchEvent(new MouseEvent('dblclick',{bubbles:true,button:0,clientX:150,clientY:100}));
 check('工具栏双击不确认截图',confirmed.length===2);
 doubleClick(100,50);await Promise.resolve();
 check('选区内真实双击序列保留原裁剪并等同Enter',confirmed.length===3&&JSON.stringify(confirmed[2])===JSON.stringify(confirmed[0]));
 doubleClick(150,100);document.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
 check('复制期间双击和Enter不会重复提交',confirmed.length===3);ui.dispose();
 ui=make();await ui.ready;drag(100,50,300,250);drag(150,100,220,180);
 check('选区内继续拖动可重画范围',JSON.stringify(ui.region())===JSON.stringify([300,200,140,160]));
 click(500,400);check('选区外单击保留范围及锁屏',JSON.stringify(ui.region())===JSON.stringify([300,200,140,160])&&locks.at(-1)===true);
 root.querySelectorAll('button')[0].click();check('工具栏仍可选择当前整屏',JSON.stringify(ui.region())===JSON.stringify([0,0,1600,1200]));
 root.querySelectorAll('button')[1].click();check('重新框选清除选区和工具栏并解锁',ui.idle&&locks.at(-1)===false&&ui.region()===null&&root.querySelector('.capture-toolbar').hidden);
 ui.reset();drag(100,50,300,250);doubleClick(500,400);await Promise.resolve();
 check('选区外双击仍复制当前整屏',confirmed.length===4&&JSON.stringify(confirmed[3])===JSON.stringify([0,0,1600,1200]));ui.dispose();
 const bytes=new ArrayBuffer(16),header=new DataView(bytes);header.setUint32(0,2,true);header.setUint32(4,1,true);new Uint8Array(bytes,8).set([12,34,56,255,78,90,123,255]);
 const raw=captureCanvas(bytes,document);check('二进制像素绘制不改变颜色',JSON.stringify([...raw.getContext('2d').getImageData(0,0,2,1).data])===JSON.stringify([12,34,56,255,78,90,123,255]));
 let invalid=false;try{captureCanvas(bytes.slice(0,12),document);}catch{invalid=true;}check('不完整像素拒绝显示',invalid);
 let attempts=0;ui=mountScreenshot(root,{image:raw,width:2,height:1,confirm:async()=>{attempts++;throw new Error('剪贴板被占用');},cancel:async()=>{}});await ui.ready;drag(100,100,500,500);
 const confirm=root.querySelector('.primary');await confirm.onclick();check('复制失败保留界面允许重试',attempts===1&&!confirm.disabled&&root.querySelector('[role=status]').textContent==='剪贴板被占用');ui.dispose();
 document.getElementById('result').textContent=JSON.stringify({ok:true,results});
}catch(error){document.getElementById('result').textContent=JSON.stringify({ok:false,results,error:error.stack});}
</script>
