name: Warm Windows Rust cache
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/build.rs'
      - '.cargo/**'
      - 'src-tauri/.cargo/**'
      - 'rust-toolchain*'
      - 'src-tauri/rust-toolchain*'
      - '.github/workflows/release.yml'
      - '.github/workflows/rust-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-rust-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Select Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
      - name: Restore and save shared Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: windows-2025-msvc-v1
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare frontend for Tauri compilation
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Warm test dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --example project-tool
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Warm release dependencies without packaging
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          npm exec -- tauri build --no-bundle -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --example update-tool
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
