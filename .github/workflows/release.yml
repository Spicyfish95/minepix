name: Build and signed release
on:
  push:
    tags: ['minepix-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
      - name: Restore Rust dependencies and build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: windows-2025-msvc-v1
          cache-bin: 'false'
          save-if: 'false'
      - name: Build actual Rust format test tool
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example project-tool
      - name: Frontend and backend regression
        run: |
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/thumbnailer/Cargo.toml --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path src-tauri/thumbnailer/Cargo.toml --lib --examples
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/test-shell-thumbnail.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-production-assets.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-repository.mjs
      - name: Build signed Windows installer
        if: startsWith(github.ref, 'refs/tags/minepix-v')
        env:
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret' }
          npm exec -- tauri build -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/create-update-manifest.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-release.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer=Join-Path 'src-tauri/target/release/bundle/nsis' ('MinePix_'+$version+'_x64-setup.exe')
          cargo run --locked --release --manifest-path src-tauri/Cargo.toml --example update-tool -- $installer $version
      - name: Retain verified Windows build outputs
        if: startsWith(github.ref, 'refs/tags/minepix-v')
        uses: actions/upload-artifact@v4
        with:
          name: minepix-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            artifacts/release/*.json
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install locked dependencies
        run: |
          npm ci
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Restore Rust dependencies and build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ubuntu-22.04-linux-v1
          cache-bin: 'false'
          save-if: 'false'
      - name: Build actual Rust format test tool
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example project-tool
      - name: Frontend and backend regression
        run: |
          npm run test:linux
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          npm run build
          node scripts/check-production-assets.mjs
          node scripts/check-repository.mjs
      - name: Build signed Linux installers
        if: startsWith(github.ref, 'refs/tags/minepix-v')
        env:
          CI: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Missing TAURI_SIGNING_PRIVATE_KEY secret' >&2
            exit 1
          fi
          npm exec -- tauri build --config src-tauri/tauri.linux.conf.json -- --locked
          node scripts/verify-linux-release.mjs
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          cargo run --locked --release --manifest-path src-tauri/Cargo.toml --example update-tool -- "$appimage" "$version"
      - name: Retain verified Linux build outputs
        if: startsWith(github.ref, 'refs/tags/minepix-v')
        uses: actions/upload-artifact@v4
        with:
          name: minepix-linux-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            artifacts/release/validation-linux.json
  publish:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/minepix-v')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: minepix-windows-x64-${{ github.sha }}
          path: .
      - name: Download verified Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: minepix-linux-x64-${{ github.sha }}
          path: .
      - name: Assemble multi-platform update manifest
        run: node scripts/create-update-manifest.mjs --require-linux
      - name: Publish version and promote verified update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
