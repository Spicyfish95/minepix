name: Windows build and signed release
on:
  push:
    tags: ['minepix-v*']
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
      - name: Build actual Rust format test tool
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example project-tool
      - name: Frontend and backend regression
        run: |
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-production-assets.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-repository.mjs
      - name: Build signed Windows installer
        if: startsWith(github.ref, 'refs/tags/minepix-v')
        env:
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret' }
          npm exec -- tauri build -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/create-update-manifest.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-release.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer=Join-Path 'src-tauri/target/release/bundle/nsis' ('MinePix_'+$version+'_x64-setup.exe')
          cargo run --locked --release --manifest-path src-tauri/Cargo.toml --example update-tool -- $installer $version
      - name: Retain verified build outputs
        if: startsWith(github.ref, 'refs/tags/minepix-v')
        uses: actions/upload-artifact@v4
        with:
          name: minepix-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            artifacts/release/*.json
      - name: Publish version and promote verified update channel
        if: startsWith(github.ref, 'refs/tags/minepix-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
