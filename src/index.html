<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MinePix</title>
  <link rel="icon" href="./assets/app-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar"><div class="brand"><img class="brand-mark" src="./assets/brand-mark.svg" alt=""> MinePix <small>PIXEL ART</small></div><div class="file-actions"><button id="theme-toggle" class="theme-toggle icon-button" title="切换主题" aria-label="切换主题"></button><span class="divider"></span><button data-action="new">新建</button><button data-action="open">打开</button><button data-action="save">保存项目 <kbd>Ctrl S</kbd></button><button class="primary" data-action="export">导出 ↗</button></div></header>
  <div id="document-tabs" role="tablist" aria-label="文档标签"></div><div class="document-bar"><span class="doc-dot"></span><span id="doc-name">未命名.pix</span><span id="dirty-mark"></span><button class="tag" id="doc-color-mode" data-action="color-mode" title="切换RGBA / 索引色 / 灰度">RGBA</button><span class="right muted" id="doc-meta"></span></div>
  <div class="options"><span id="tool-indicator" class="tool-indicator"></span><div id="tool-name">铅笔</div><span class="divider"></span><label>笔刷 <input id="brush" type="number" min="1" max="128" value="1"> px</label><label><input id="symmetry" type="checkbox"> 水平对称</label><label><input id="symmetry-vertical" type="checkbox">垂直对称</label><button id="symmetry-reset" type="button">重置对称轴</button><span id="slice-controls" hidden><button data-action="slice-properties">切片属性</button><button data-action="delete-active-slice">删除切片</button><button data-action="clear-slices">清除所有切片</button></span><span class="right"></span><label><input type="checkbox" id="grid"> 显示网格</label><label><input type="checkbox" id="onion"> 洋葱皮</label><button data-action="onion-settings" id="onion-settings" class="icon-button" title="洋葱皮设置" aria-label="洋葱皮设置"></button><button data-action="fit">适应画布</button></div>
  <div class="drawing-options"><label>笔形 <select id="brush-shape"><option value="square">方形</option><option value="circle">圆形</option><option value="line">线形</option><option value="pattern">图案</option></select></label><label>角度 <input id="brush-angle" type="number" min="0" max="360" value="0">°</label><label>透明度 <input id="paint-opacity" type="number" min="0" max="100" value="100">%</label><label>墨水 <select id="ink-mode"><option value="simple">简单墨水</option><option value="over">Alpha 合成</option><option value="copy">复制 Alpha+颜色</option><option value="lock-alpha">锁定 Alpha</option><option value="shading">Shading 明暗</option></select></label><span id="shading-controls" hidden>在色板拖选明暗范围 · 左键前一色 / 右键后一色</span><span id="gradient-controls" hidden><label>渐变类型<select id="gradient-type"><option value="linear">线性</option><option value="radial">径向</option></select></label><label>渐变抖动<select id="gradient-dither"><option value="none">无</option><option value="ordered">有序 4×4</option></select></label></span><span id="stabilizer-controls" hidden><label><input id="stabilizer-enabled" type="checkbox">笔画稳定器</label><label>稳定距离 <input id="stabilizer-distance" type="number" min="0" max="64" value="16"></label></span><span id="fill-controls" hidden><label>填充容差 <input id="fill-tolerance" type="number" min="0" max="255" value="0"></label><label><input id="fill-contiguous" type="checkbox" checked>连续填充</label></span><span id="pattern-controls" hidden><label>图案对齐 <select id="pattern-mode"><option value="source">对齐到来源</option><option value="destination">对齐到落点</option><option value="brush">像普通笔刷</option></select></label><label>笔刷库 <select id="pattern-library"><option value="">（未选择）</option></select></label><button data-action="save-pattern-brush" title="把当前图案与笔刷参数存到本机笔刷库">存为笔刷</button><button data-action="delete-pattern-brush" title="从本机笔刷库删除当前图案笔刷">删除笔刷</button></span><label title="适用于 1px 自由笔触"><input id="pixel-perfect" type="checkbox"> 像素完美</label><label><input id="shape-filled" type="checkbox"> 填充形状</label><span class="right"></span><button data-action="capture-brush" title="从最大 128×128 的选区建立图案笔刷">选区建笔刷</button><button data-action="brush-presets">笔刷预设</button><button data-action="pen-settings">数位笔</button><button data-action="replace-color" title="按容差替换颜色（Aseprite 编辑→替换颜色，Shift+R）">替换颜色</button></div>
  <div class="drawing-options selection-options" id="selection-options" hidden><label>选区 <select id="selection-kind"><option value="rect">矩形</option><option value="ellipse">椭圆</option><option value="lasso">自由套索</option><option value="polygon">多边形套索</option><option value="wand">魔棒</option></select></label><label>操作 <select id="selection-operation"><option value="replace">替换</option><option value="add">相加</option><option value="subtract">相减</option><option value="intersect">相交</option></select></label><label>魔棒容差 <input id="wand-tolerance" type="number" min="0" max="255" value="0"></label><span class="selection-inline-actions"><button data-action="invert-selection">反选</button><button data-action="reselect">重选</button><button data-action="select-content">选择可见内容</button><button data-action="transform-selection">缩放 / 旋转</button><span class="divider"></span><button data-action="copy">复制</button><button data-action="paste">粘贴</button><button data-action="flip-x">水平翻转</button><button data-action="flip-y">垂直翻转</button><button data-action="clear">清除像素</button><button data-action="deselect">取消选区</button></span></div>
  <div class="drawing-options text-options" id="text-options" hidden><label>字体 <input id="text-family" list="text-fonts" value="sans-serif" maxlength="120" size="12"></label><datalist id="text-fonts"><option value="sans-serif"></option><option value="serif"></option><option value="monospace"></option><option value="Microsoft YaHei"></option><option value="SimSun"></option><option value="KaiTi"></option><option value="Segoe UI"></option><option value="Arial"></option><option value="Courier New"></option><option value="Consolas"></option></datalist><label>字号 <input id="text-size" type="number" min="1" max="512" value="16"></label><label><input id="text-bold" type="checkbox"> 粗体</label><label><input id="text-italic" type="checkbox"> 斜体</label><label><input id="text-antialias" type="checkbox" checked> 抗锯齿</label><label><input id="text-ligatures" type="checkbox" checked> 连字</label><label>对齐 <select id="text-align"><option value="left">左</option><option value="center">中</option><option value="right">右</option></select></label><label><input id="text-fill" type="checkbox" checked> 填充</label><label><input id="text-stroke" type="checkbox"> 描边</label><label>描边宽 <input id="text-stroke-width" type="number" min="1" max="64" value="1"></label></div>
  <main>
    <nav class="tools" id="tools" aria-label="绘画工具"></nav>
    <aside class="palette-panel"><div class="panel-heading"><strong data-heading-icon="palette">颜色</strong><span><button data-action="palette-size" class="icon-button" title="色板尺寸" aria-label="色板尺寸"></button><button data-action="palette-editor" class="icon-button" title="编辑、排序和删除色板颜色"></button></span></div><div class="color-current"><div class="color-swatches"><input type="color" id="background-color" value="#171b2b" aria-label="背景色"><input type="color" id="color" value="#edb75b" aria-label="前景色"></div><div class="color-readout"><input type="text" id="hex" value="#EDB75B" maxlength="9" aria-label="前景 HEX 颜色"><small id="color-role">右键：擦除</small></div></div><div id="palette" class="palette"></div><div class="palette-library-row"><select id="palette-library" aria-label="色板库"></select><button data-action="save-palette" title="把当前色板存到本机色板库">存为色板</button><button data-action="delete-palette" title="从本机色板库删除选中的用户色板">删色板</button><button data-action="remap-indices" id="remap-indices" title="按旧色板颜色把索引像素重映射到新色板" hidden>重映射</button></div><button id="add-color" class="wide">＋ 添加到色板</button><div class="palette-file-actions"><button data-action="import-palette" title="导入 JSON / GPL 色板">导入</button><button data-action="export-palette" title="导出 JSON 色板">导出</button><button data-action="extract-palette" title="提取当前帧颜色">提色</button></div><div class="hint"><div class="studio-art"><img class="art-dark" src="./assets/studio-vignette-dark.svg" alt="像素风蘑菇与森林"><img class="art-light" src="./assets/studio-vignette-light.svg" alt=""></div><strong>让每个像素都有意义。</strong><p>滚轮缩放 · 空格拖动画布<br>Alt 临时吸色 · [ ] 调整笔刷</p></div></aside>
    <section class="workspace"><div class="canvas-label"><span id="canvas-label">画布</span><div class="canvas-actions"><button data-action="canvas-size" title="调整全部帧的画布尺寸">画布</button><button data-action="crop-selection" title="按矩形选区裁剪全部帧">裁剪</button><button data-action="trim-canvas" title="按全部帧内容自动裁边">裁边</button><button data-action="sprite-size" title="缩放全部图层与帧（Aseprite 精灵→图像大小，Ctrl+Alt+I）">图像大小</button><button data-action="grid-settings" title="设置网格偏移与宽高（Aseprite 视图→网格→网格设置）">网格设置</button><button data-action="slices" title="管理 Slice 区域、pivot 和九宫格">切片</button><label>无缝平铺<select id="tiled-mode"><option value="none">关闭</option><option value="x">横向</option><option value="y">纵向</option><option value="both">双向</option></select></label><span class="canvas-mode" data-heading-icon="grid">透明背景</span></div></div><div id="viewport" tabindex="0" aria-label="画布工作区"><div id="canvas-wrap"><canvas id="canvas" aria-label="像素画布"></canvas></div><canvas id="overlay"></canvas></div><section id="welcome" aria-label="欢迎页"><div class="welcome-inner"><img class="welcome-mark" src="./assets/app-icon.png" alt=""><h1>MinePix</h1><p class="welcome-sub">像素绘画与逐帧动画编辑器 · 打开项目或从空白画布开始</p><div class="welcome-actions"><button class="primary" data-action="new">新建项目</button><button data-action="open">打开文件</button><button data-action="recent-files">最近文件</button></div><div class="welcome-recent"><h2>最近文件</h2><div id="welcome-recent" class="welcome-recent-list"></div></div></div></section><div class="workspace-bottom"><span id="coordinates">X —　Y —</span><span id="selection-info"></span><div class="right zoom-controls"><button data-action="zoom-out">−</button><span id="zoom-label">800%</span><button data-action="zoom-in">＋</button></div></div></section>
    <aside class="right-panel"><div class="panel-heading"><strong data-heading-icon="zoom">导航预览</strong><span>PREVIEW</span></div><div class="preview-area"><canvas id="preview" width="192" height="192"></canvas></div><div class="preview-caption"><span id="preview-frame">帧 1 / 1</span><span id="preview-time">100 ms</span></div><div class="panel-heading layer-heading" title="图层" aria-label="图层"><span><button data-action="add-layer" title="新建图层">＋</button></span></div><div id="layers" role="tree" aria-label="图层"></div><div class="layer-controls"><button data-action="layer-up" title="上移">↑</button><button data-action="layer-down" title="下移">↓</button><button data-action="duplicate-layer" title="复制图层">复制</button><button data-action="delete-layer" title="删除图层">删除</button></div><div class="layer-merge-controls"><button data-action="toggle-background">背景⇄普通</button></div><div class="layer-merge-controls"><button data-action="group-layer">编组</button><button data-action="ungroup-layer">解组</button><button data-action="layer-parent">移动到组</button></div><div class="layer-merge-controls"><button data-action="tileset-toggle" title="按图块尺寸切分当前图层像素，生成图集（Godot 图块来源）">转为图集</button></div><div class="layer-merge-controls"><button data-action="merge-down" title="合并当前与下一图层的全部帧">向下合并</button><button data-action="merge-visible" title="合并全部可见图层，保留隐藏图层">合并可见</button></div><label class="opacity"><input id="layer-continuous" type="checkbox">连续层（新帧共享图像）</label><label class="opacity" id="group-mode-label" hidden>组模式 <select id="group-mode"><option value="isolated">隔离</option><option value="pass">穿透（原版 1.3）</option></select></label><p class="muted note">双击图层名称重命名<br>点击眼睛显示 / 隐藏，锁定后禁止绘画</p></aside>

  </main>
  <section class="timeline"><div class="timeline-toolbar"><strong data-heading-icon="frame">时间轴</strong><span class="tag">ANIMATION</span><button data-action="previous" title="上一帧">|◀</button><button data-action="play" id="play" class="play">▶ 播放</button><button data-action="next" title="下一帧">▶|</button><span class="divider"></span><button data-action="add-frame">＋ 空白帧</button><button data-action="duplicate-frame">复制帧</button><button data-action="delete-frame">删除帧</button><span class="right"></span><label><span data-heading-icon="clock" class="duration-label" id="duration-scope">帧时长</span> <input id="duration" type="number" value="100" min="20" max="10000"> ms</label></div><div class="timeline-options"><label>选择 <select id="timeline-mode"><option value="frames">帧列</option><option value="cels">cel 矩形</option></select></label><button data-action="cel-properties">Cel 属性</button><span id="frame-selection-info">已选 1 帧</span><span class="timeline-action-group" id="frame-actions"><label>插入 <select id="frame-insert"><option value="after">选中帧之后</option><option value="before">选中帧之前</option></select></label><button data-action="frame-left" title="选中帧左移">左移</button><button data-action="frame-right" title="选中帧右移">右移</button><button data-action="reverse-frames">倒序</button></span><span class="timeline-action-group" id="cel-actions" hidden><button data-action="copy-cels" title="复制 cel 范围（时间轴聚焦时 Ctrl+C）">复制 cel</button><button data-action="cut-cels" title="剪切 cel 范围（Ctrl+X）">剪切</button><button data-action="paste-cels" title="从范围左上角粘贴（Ctrl+V）">粘贴</button><button data-action="clear-cels" title="清除 cel 像素，保留帧和图层（Delete）">清除</button><button data-action="move-cels">移动 cel</button><button data-action="transform-cels">批量变换</button><button data-action="flip-cels-x" title="共同内容边界内水平翻转">水平</button><button data-action="flip-cels-y" title="共同内容边界内垂直翻转">垂直</button><button data-action="deselect-cels" title="收回到活动 cel">收回</button></span><button data-action="link-cels" title="当前层所选帧共享当前图像，覆盖目标内容，可撤销">链接到当前帧</button><button data-action="unlink-cels">取消链接</button><button data-action="frame-fps">FPS</button><span class="divider"></span><label>范围 <select id="play-range"><option value="all">全部帧</option><option value="selected">选中帧</option></select></label><button data-action="add-tag">新标签</button><button data-action="edit-tag" id="edit-tag">编辑</button><button data-action="delete-tag" id="delete-tag">删除标签</button><label>播放 <select id="play-direction"><option value="tag">标签默认 / 正向</option><option value="forward">正向</option><option value="reverse">反向</option><option value="pingpong">往返</option></select></label><label><input type="checkbox" id="play-once"> 单次</label></div><div id="timeline-grid" class="timeline-grid" tabindex="0" aria-label="动画时间轴"></div></section>
  <footer><span class="status-dot"></span><span id="status" role="status" aria-live="polite">就绪</span><span class="right" id="tool-hint"></span><button data-action="input" title="配置鼠标与滚轮">鼠标设置</button><button data-action="keymap" title="配置快捷键">按键设置</button><button data-action="shortcuts" title="快捷键与鼠标说明 F1">快捷键 F1</button></footer>
  <label class="opacity" hidden>混合 <select id="layer-blend" aria-label="图层混合模式"></select></label><label class="opacity" hidden>不透明度 <input id="opacity" type="range" min="0" max="100" value="100"><output id="opacity-label">100%</output></label>
  <dialog id="modal" aria-labelledby="modal-title"><form method="dialog" id="modal-form"><div class="modal-heading"><h2 id="modal-title"></h2><button type="button" value="cancel" aria-label="关闭">×</button></div><div id="modal-content"></div><div class="modal-actions"><button type="button" value="cancel">取消</button><button id="modal-submit" class="primary" value="ok">确定</button></div></form></dialog>
  <input type="file" id="file-input" accept=".pix,.json,.png,.jpg,.jpeg,.webp,.bmp,.gif" hidden>
  <section class="reference-panel" id="reference-panel" hidden></section>
  <section class="terrain-preview-panel" id="terrain-preview-panel" hidden></section>
  <section class="tileset-panel" id="tileset-panel" hidden></section>
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
