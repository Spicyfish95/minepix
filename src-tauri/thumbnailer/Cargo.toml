[package]
name = "minepix-thumbnailer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "minepix_thumbnailer"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
flate2 = "1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
